@if (isReady) {
  <div class="app-shell" [class.sidebar-active]="isSidebarOpen">
    
    <app-sidebar class="app-sidebar"></app-sidebar>

    <div class="sidebar-overlay" (click)="toggleSidebar()"></div>

    <div class="app-main-wrapper">
      <app-header class="app-header" (toggleMenu)="toggleSidebar()"></app-header>
      
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>

      <app-footer class="app-footer"></app-footer>
    </div>
  </div>
} @else {
  <div style="display: flex; height: 100vh; width: 100vw; overflow: hidden; background-color: #F8FAFC;">
    
    <div style="width: 260px; background: white; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column; padding: 24px;">
      <app-skeleton width="140px" height="32px" marginBottom="40px"></app-skeleton>
      
      <app-skeleton width="100%" height="40px" borderRadius="8px" marginBottom="12px"></app-skeleton>
      <app-skeleton width="100%" height="40px" borderRadius="8px" marginBottom="12px"></app-skeleton>
      <app-skeleton width="100%" height="40px" borderRadius="8px" marginBottom="12px"></app-skeleton>
      <app-skeleton width="100%" height="40px" borderRadius="8px" marginBottom="12px"></app-skeleton>
      <app-skeleton width="100%" height="40px" borderRadius="8px" marginBottom="12px"></app-skeleton>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      
      <div style="height: 64px; background: white; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
        <app-skeleton width="24px" height="24px" borderRadius="4px" marginBottom="0"></app-skeleton>
        
        <div style="display: flex; align-items: center; gap: 12px;">
          <app-skeleton width="120px" height="16px" marginBottom="0"></app-skeleton>
          <app-skeleton width="36px" height="36px" borderRadius="50%" marginBottom="0"></app-skeleton>
        </div>
      </div>

      <div style="padding: 32px; flex: 1;">
        <app-skeleton width="30%" height="32px" marginBottom="12px"></app-skeleton>
        <app-skeleton width="50%" height="16px" marginBottom="32px"></app-skeleton>

        <div style="background: white; border-radius: 8px; border: 1px solid #E2E8F0; padding: 24px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
            <app-skeleton width="200px" height="24px" marginBottom="0"></app-skeleton>
            <app-skeleton width="120px" height="36px" borderRadius="6px" marginBottom="0"></app-skeleton>
          </div>
          <app-skeleton width="100%" height="40px" marginBottom="12px"></app-skeleton>
          <app-skeleton width="100%" height="40px" marginBottom="12px"></app-skeleton>
          <app-skeleton width="100%" height="40px" marginBottom="12px"></app-skeleton>
        </div>
      </div>
      
    </div>
  </div>
}
