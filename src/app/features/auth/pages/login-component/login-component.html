<div class="login-container">
  <div class="circle circle-top-right"></div>
  <div class="circle circle-bottom-left"></div>

  <div class="login-card">
    
    <div class="login-header">
      <img src="assets/login/retrofit.webp" alt="Retrofit Logo" class="logo">
      <h1>Gestor de Ingeniería</h1>
      <p>Retrofit Ingenieros Asociados SAC</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrapper">
          <span class="icon"><i class="fa-solid fa-user"></i></span> 
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            placeholder="Username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
        </div>
        <div class="input-wrapper">
          <span class="icon"><i class="fa-solid fa-lock"></i></span> 
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Cargando...' : 'Iniciar Sesión' }}
        <span *ngIf="!isLoading" class="arrow-icon"><i class="fa-solid fa-chevron-right"></i></span>
      </button>

    </form>

    <div class="login-footer">
      <div class="security-badge">
        <span><i class="fa-solid fa-shield-halved"></i></span> Conexión segura cifrada SSL
      </div>
      <div class="footer-links">
        <span class="lang-selector"><i class="fa-solid fa-globe"></i> ESPAÑOL</span>
        <span class="divider">|</span>
        <span class="version">v1.0.0-stable</span>
      </div>
    </div>

  </div>

  <div class="copyright">
    © 2026 Retrofit Ingenieros Asociados SAC. <br>
    Sistema de información reservado, el acceso no autorizado a este sistema está prohibido.
  </div>
</div>
